name: D2 GAP-007 One-shot Candidate

on:
  push:
    branches:
      - feat/issue-72-d2-01-invitation-lifecycle

jobs:
  apply-js-yaml-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/issue-72-d2-01-invitation-lifecycle
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Apply only the current npm-backed js-yaml candidate
        shell: bash
        run: |
          set -euo pipefail
          before=$(node -p "require('./package-lock.json').packages['node_modules/js-yaml']?.version || ''")
          [ "$before" = '3.15.1' ] || { echo "Unexpected current js-yaml version: $before"; exit 2; }
          npm update js-yaml --package-lock-only --ignore-scripts
          after=$(node -p "require('./package-lock.json').packages['node_modules/js-yaml']?.version || ''")
          [ "$after" != '3.15.1' ] && [ -n "$after" ] || { echo "js-yaml candidate did not advance"; exit 3; }
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          [ "$changed" = 'package-lock.json ' ] || { echo "Unexpected candidate scope: $changed"; exit 4; }

      - name: Commit candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papyr-gap007-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/d2-gap007-one-shot.yml
          git commit -m 'chore: apply npm-backed js-yaml security candidate'
          git push origin HEAD:feat/issue-72-d2-01-invitation-lifecycle
