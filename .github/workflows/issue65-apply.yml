name: Issue 65 Apply

on:
  push:
    branches: [fix/issue-65-team-creator-owner]
    paths: ['.github/workflows/issue65-apply.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-65-team-creator-owner
          fetch-depth: 0
      - name: Apply bounded Issue 65 source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          storage_path = Path('server/storage.ts')
          storage = storage_path.read_text()
          old_storage = """  async createTeam(team: InsertTeam): Promise<Team> {
    if (team.password) {
      team.password = await bcrypt.hash(team.password, 10);
    }
    const result = await this.db.insert(teams).values(team).returning();
    return result[0];
  }
"""
          new_storage = """  async createTeam(team: InsertTeam): Promise<Team> {
    const teamValues = { ...team };
    if (teamValues.password) {
      teamValues.password = await bcrypt.hash(teamValues.password, 10);
    }
    const result = await this.db.insert(teams).values(teamValues).returning();
    return result[0];
  }

  async createTeamWithOwner(team: InsertTeam, creatorUserId: number): Promise<Team> {
    const teamValues = { ...team };
    if (teamValues.password) {
      teamValues.password = await bcrypt.hash(teamValues.password, 10);
    }

    return this.db.transaction(async (tx: any) => {
      const teamResult = await tx.insert(teams).values(teamValues).returning();
      const createdTeam = teamResult[0];
      await tx.insert(teamMembers).values({
        teamId: createdTeam.id,
        userId: creatorUserId,
        role: 'owner',
        invitedBy: null,
      });
      return createdTeam;
    });
  }
"""
          if old_storage not in storage:
              raise SystemExit('expected createTeam block not found')
          storage_path.write_text(storage.replace(old_storage, new_storage, 1))

          routes_path = Path('server/routes.ts')
          routes = routes_path.read_text()
          old_routes = """    app.post('/api/teams', requireAuthIfEnabled, async (req, res) => {
      try {
        const validatedData = insertTeamSchema.parse(req.body);
        const team = await storage.createTeam(validatedData);
        res.status(201).json(team);
      } catch (error) {
"""
          new_routes = """    app.post('/api/teams', requireAuthIfEnabled, async (req: AuthRequest, res) => {
      try {
        const validatedData = insertTeamSchema.parse(req.body);
        const creatorUserId = req.user?.id;
        const team = creatorUserId
          ? await storage.createTeamWithOwner(validatedData, creatorUserId)
          : await storage.createTeam(validatedData);
        res.status(201).json(team);
      } catch (error) {
"""
          if old_routes not in routes:
              raise SystemExit('expected POST /api/teams block not found')
          routes_path.write_text(routes.replace(old_routes, new_routes, 1))
          PY

          rm .github/workflows/issue65-apply.yml
          git config user.name 'papyr-issue65-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/storage.ts server/routes.ts .github/workflows/issue65-apply.yml
          git diff --cached --check
          git commit -m 'fix: make team creator initial owner'
          git push origin HEAD:fix/issue-65-team-creator-owner
