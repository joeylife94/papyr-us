name: Portfolio V3 Proof Capture

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/portfolio-v3-proof.spec.ts'
      - '.github/workflows/portfolio-v3-proof.yml'
      - 'client/**'
      - 'server/**'
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://papyrus_user:papyrus_password_2024@localhost:5432/papyrus_db
  E2E_USE_STORAGE_STATE: '0'
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  portfolio-proof:
    name: Capture buyer-facing Papyr.us proof
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papyrus_user
          POSTGRES_PASSWORD: papyrus_password_2024
          POSTGRES_DB: papyrus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papyrus_user -d papyrus_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Install Playwright Chromium
        timeout-minutes: 20
        run: npx playwright install chromium --with-deps

      - name: Synchronize PostgreSQL schema
        run: npm run db:push -- --force

      - name: Capture Portfolio V3 proof
        run: npx playwright test tests/portfolio-v3-proof.spec.ts --project=chromium --reporter=dot

      - name: Verify and checksum proof assets
        run: |
          test -s portfolio-proof-v3/01-team-workspace-with-document.png
          test -s portfolio-proof-v3/02-version-history-before-restore.png
          test -s portfolio-proof-v3/03-version-restored.png
          (
            cd portfolio-proof-v3
            sha256sum *.png > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          printf 'candidate_head=%s\n' "$CANDIDATE_SHA" > portfolio-proof-v3/PROVENANCE.txt
          printf 'workflow_sha=%s\n' "$GITHUB_SHA" >> portfolio-proof-v3/PROVENANCE.txt
          printf 'base_sha=%s\n' "$BASE_SHA" >> portfolio-proof-v3/PROVENANCE.txt
          printf 'generated_by=Portfolio V3 Proof Capture\n' >> portfolio-proof-v3/PROVENANCE.txt
          printf 'data_class=synthetic-only\n' >> portfolio-proof-v3/PROVENANCE.txt
          printf 'purpose=buyer-facing portfolio evidence\n' >> portfolio-proof-v3/PROVENANCE.txt

      - name: Upload Portfolio V3 proof
        uses: actions/upload-artifact@v4
        with:
          name: papyr-portfolio-v3-proof-${{ env.CANDIDATE_SHA }}
          path: portfolio-proof-v3/
          if-no-files-found: error
          retention-days: 30
