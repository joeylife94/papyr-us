name: v1.0 Proof Package

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/proof/**'
      - 'tests/proof-v1.spec.ts'
      - '.github/workflows/v1-proof.yml'
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://papyrus_user:papyrus_password_2024@localhost:5432/papyrus_db
  E2E_USE_STORAGE_STATE: '0'

jobs:
  fresh-proof:
    name: Fresh synthetic browser proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papyrus_user
          POSTGRES_PASSWORD: papyrus_password_2024
          POSTGRES_DB: papyrus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papyrus_user -d papyrus_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exact dependency graph
        run: npm ci

      - name: Install Playwright Chromium
        timeout-minutes: 20
        run: npx playwright install chromium --with-deps

      - name: Synchronize PostgreSQL schema
        run: npm run db:push -- --force

      - name: Generate fresh v1.0 browser proof
        run: npx playwright test tests/proof-v1.spec.ts --config=playwright.layer5.config.ts --project=chromium --reporter=dot

      - name: Verify and checksum proof assets
        run: |
          test -s proof-artifacts/01-team-pages.png
          test -s proof-artifacts/02-created-page.png
          sha256sum proof-artifacts/*.png > proof-artifacts/SHA256SUMS
          printf 'candidate_head=%s\n' "$GITHUB_SHA" > proof-artifacts/PROVENANCE.txt
          printf 'generated_by=v1.0 Proof Package\n' >> proof-artifacts/PROVENANCE.txt
          printf 'data_class=synthetic-only\n' >> proof-artifacts/PROVENANCE.txt

      - name: Upload fresh proof package
        uses: actions/upload-artifact@v4
        with:
          name: v1-proof-${{ github.sha }}
          path: proof-artifacts/
          if-no-files-found: error
          retention-days: 14
