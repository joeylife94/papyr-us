name: Issue 76 UI Visual Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      # The package exercises real behavior (restore, tree, links), not only the client.
      - 'server/**'
      - 'shared/**'
      - 'tests/issue-76-visual-proof.spec.ts'
      - '.github/workflows/issue-76-visual-proof.yml'
  workflow_dispatch: {}

env:
  NODE_VERSION: '22'
  DATABASE_URL: postgresql://papyrus_user:papyrus_password_2024@localhost:5432/papyrus_db
  E2E_USE_STORAGE_STATE: '0'
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  visual-proof:
    name: Capture synthetic Issue 76 browser screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papyrus_user
          POSTGRES_PASSWORD: papyrus_password_2024
          POSTGRES_DB: papyrus_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papyrus_user -d papyrus_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      # db:push drops wiki_pages.search_vector, so FTS is applied after it (as in ci.yml).
      - name: Synchronize PostgreSQL schema
        run: |
          npm run db:push -- --force
          npm run test:db:fts
      - name: Capture and verify current UI
        run: npx playwright test tests/issue-76-visual-proof.spec.ts --project=chromium --reporter=dot
      # Review package for #101 P7 (absorbs #75's buyer-facing capture).
      - name: Verify screenshots and provenance
        if: success()
        run: |
          for shot in \
            01-workspace-empty-desktop 02-workspace-populated-desktop 03-page-editing-desktop \
            04-version-history-desktop 05-version-restore-confirm-desktop \
            06-version-restored-desktop 07-page-reading-desktop 08-workspace-dark \
            09-page-editing-dark 10-version-history-dark 11-mobile-workspace 12-mobile-page \
            13-mobile-navigation; do
            test -s "issue-76-proof/$shot.png" || { echo "missing $shot.png"; exit 1; }
          done
          ( cd issue-76-proof && sha256sum *.png > SHA256SUMS && sha256sum -c SHA256SUMS )
          {
            printf 'candidate_head=%s\n' "$CANDIDATE_SHA"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'base_sha=%s\n' "$BASE_SHA"
            printf 'generated_by=Issue 76 UI Visual Proof (#101 P7 review package)\n'
            printf 'data_class=synthetic-only\n'
            printf 'purpose=review package for #101 and #103; buyer-facing capture (#75)\n'
          } > issue-76-proof/PROVENANCE.txt
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papyrus-ui-proof-${{ env.CANDIDATE_SHA }}
          path: |
            issue-76-proof/
            test-results/
          if-no-files-found: warn
          retention-days: 30
