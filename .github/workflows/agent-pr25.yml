name: Agent PR25 dashboard aggregation patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch storage overview
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('server/storage.ts')
          text = path.read_text()
          start = text.index('  async getDashboardOverview(teamIds: number[]): Promise<any> {')
          end = text.index('\n  async getTasks(', start)
          replacement = '''  async getDashboardOverview(teamIds: number[]): Promise<any> {
    if (teamIds.length === 0) {
      return {
        totalPages: 0,
        totalComments: 0,
        totalMembers: 0,
        totalTasks: 0,
        activeTeams: 0,
        recentActivity: [],
        teamStats: [],
      };
    }

    const teamIdStrings = teamIds.map(String);
    const [pageCountResult, commentCountResult, memberCountResult, taskCountResult, teamRecords] =
      await Promise.all([
        this.db.select({ count: sql`count(*)` }).from(wikiPages).where(inArray(wikiPages.teamId, teamIds)),
        this.db.select({ count: sql`count(*)` }).from(comments).innerJoin(wikiPages, eq(comments.pageId, wikiPages.id)).where(inArray(wikiPages.teamId, teamIds)),
        this.db.select({ count: sql`count(*)` }).from(members).where(inArray(members.teamId, teamIds)),
        this.db.select({ count: sql`count(*)` }).from(tasks).where(inArray(tasks.teamId, teamIdStrings)),
        this.db.select({ id: teams.id, name: teams.name, displayName: teams.displayName }).from(teams).where(inArray(teams.id, teamIds)),
      ]);

    const teamStats = await Promise.all(
      teamRecords.map(async (team: { id: number; name: string; displayName: string }) => {
        const [pagesResult, commentsResult, tasksResult] = await Promise.all([
          this.db.select({ count: sql`count(*)` }).from(wikiPages).where(and(eq(wikiPages.teamId, team.id), isNull(wikiPages.deletedAt))),
          this.db.select({ count: sql`count(*)` }).from(comments).innerJoin(wikiPages, eq(comments.pageId, wikiPages.id)).where(and(eq(wikiPages.teamId, team.id), isNull(wikiPages.deletedAt))),
          this.db.select({ count: sql`count(*)` }).from(tasks).where(eq(tasks.teamId, String(team.id))),
        ]);
        return {
          teamId: team.id,
          name: team.displayName || team.name,
          pages: Number(pagesResult[0].count),
          comments: Number(commentsResult[0].count),
          tasks: Number(tasksResult[0].count),
        };
      })
    );

    return {
      totalPages: Number(pageCountResult[0].count),
      totalComments: Number(commentCountResult[0].count),
      totalMembers: Number(memberCountResult[0].count),
      totalTasks: Number(taskCountResult[0].count),
      activeTeams: teamRecords.length,
      recentActivity: [],
      teamStats,
    };
  }
'''
          path.write_text(text[:start] + replacement + text[end:])

          Path('tests/unit/dashboard-real-team-stats.test.ts').write_text('''import { readFileSync } from 'node:fs';
import { describe, expect, it } from 'vitest';
import { DBStorage } from '../../server/storage';

describe('dashboard real-team behavior', () => {
  it('returns a complete empty overview for users with no teams', async () => {
    const storage = Object.create(DBStorage.prototype) as DBStorage;
    await expect(storage.getDashboardOverview([])).resolves.toEqual({
      totalPages: 0,
      totalComments: 0,
      totalMembers: 0,
      totalTasks: 0,
      activeTeams: 0,
      recentActivity: [],
      teamStats: [],
    });
  });

  it('does not request legacy hard-coded team identifiers', () => {
    const source = readFileSync('client/src/pages/dashboard.tsx', 'utf8');
    expect(source).not.toContain('/api/dashboard/team/team1');
    expect(source).not.toContain('/api/dashboard/team/team2');
    expect(source).toContain('teamStats.map');
  });
});
''')
          PY
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/agent-pr25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/storage.ts tests/unit/dashboard-real-team-stats.test.ts .github/workflows/agent-pr25.yml
          git commit -m "fix: aggregate dashboard by accessible teams"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
