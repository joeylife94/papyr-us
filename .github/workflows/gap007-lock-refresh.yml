name: GAP-007 Lock Refresh Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  generate-lock:
    name: Generate npm lock candidate for first blocker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Regenerate smallest compatible Sentry lock boundary
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json package-lock.before.json
          npm view '@sentry/node@^10.38.0' version dependencies.minimatch --json > sentry-registry-boundary.json
          npm update @sentry/node @sentry/profiling-node --package-lock-only --ignore-scripts
          git diff -- package-lock.json > package-lock.diff
          node <<'NODE'
          const fs = require('fs');
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};
          const rows = Object.entries(pkgs)
            .filter(([p]) => p.includes('@sentry/') || p.endsWith('/minimatch') || p.endsWith('/brace-expansion'))
            .map(([p, v]) => ({ path: p, version: v.version, dev: v.dev === true, dependencies: v.dependencies || {} }));
          console.log(JSON.stringify(rows.filter(r => r.path === 'node_modules/@sentry/node' || r.path === 'node_modules/@sentry/profiling-node' || r.path === 'node_modules/minimatch' || r.path === 'node_modules/brace-expansion'), null, 2));
          fs.writeFileSync('lock-refresh-summary.json', JSON.stringify(rows, null, 2));
          NODE
          npm audit --omit=dev --json > npm-audit-after-refresh.json || true
          test -s package-lock.diff

      - name: Upload npm-generated lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: gap007-lock-refresh-candidate
          path: |
            package-lock.json
            package-lock.diff
            lock-refresh-summary.json
            sentry-registry-boundary.json
            npm-audit-after-refresh.json
          retention-days: 3
