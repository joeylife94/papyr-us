name: GAP-007 Lock Refresh Candidate

on:
  pull_request:
    branches: [main]

jobs:
  generate-and-commit:
    name: Generate and commit npm lock correction
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate bounded dependency correction with npm
        shell: bash
        run: |
          set -euo pipefail

          npm install 'tailwindcss-animate@^1.0.7' \
            --save-dev --package-lock-only --ignore-scripts

          npm install '@sentry/node@10.40.0' '@sentry/profiling-node@10.40.0' \
            --save --package-lock-only --ignore-scripts

          npm audit --omit=dev --json > npm-audit-after-refresh.json || true
          npm ls brace-expansion --omit=dev --all --json > brace-ancestry-after-refresh.json 2>&1 || true

          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-after-refresh.json', 'utf8'));
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};

          const braceFinding = audit.vulnerabilities?.['brace-expansion'];
          if (braceFinding && ['high', 'critical'].includes(String(braceFinding.severity || '').toLowerCase())) {
            throw new Error(`brace-expansion remains a production HIGH/CRITICAL audit finding: ${braceFinding.range || ''}`);
          }

          const vulnerableBrace = pkgs['node_modules/brace-expansion'];
          if (!vulnerableBrace || vulnerableBrace.dev !== true) {
            throw new Error(`root brace-expansion blocker is not dev:true: ${JSON.stringify(vulnerableBrace || null)}`);
          }
          const rootMinimatch = pkgs['node_modules/minimatch'];
          if (!rootMinimatch || rootMinimatch.dev !== true) {
            throw new Error(`root minimatch blocker path is not dev:true: ${JSON.stringify(rootMinimatch || null)}`);
          }

          console.log(`Verified old blocker path is dev-only: brace-expansion@${vulnerableBrace.version}, minimatch@${rootMinimatch.version}.`);
          console.log('Safe nested runtime brace-expansion versions are allowed when not reported HIGH/CRITICAL by production audit.');
          NODE

          git diff --check -- package.json package-lock.json
          git diff -- package.json package-lock.json

      - name: Commit npm-generated correction and remove generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papyr-us-gap007-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -- .github/workflows/gap007-lock-refresh.yml
          git add -- package.json package-lock.json
          git diff --cached --check
          git status --short
          git commit -m 'fix: remove first GAP-007 runtime dependency path'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
