name: GAP-007 Lock Refresh Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  generate-lock:
    name: Generate npm lock candidate for first blocker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Regenerate smallest compatible minimatch lock boundary
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json package-lock.before.json
          npm update minimatch --package-lock-only --ignore-scripts
          git diff -- package-lock.json > package-lock.diff
          node <<'NODE'
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};
          const rows = Object.entries(pkgs)
            .filter(([p]) => p.endsWith('/minimatch') || p.endsWith('/brace-expansion'))
            .map(([p, v]) => ({ path: p, version: v.version, dev: v.dev === true, dependencies: v.dependencies || {} }));
          console.log(JSON.stringify(rows, null, 2));
          require('fs').writeFileSync('lock-refresh-summary.json', JSON.stringify(rows, null, 2));
          NODE
          test -s package-lock.diff

      - name: Upload npm-generated lock candidate
        uses: actions/upload-artifact@v4
        with:
          name: gap007-lock-refresh-candidate
          path: |
            package-lock.json
            package-lock.diff
            lock-refresh-summary.json
          retention-days: 3
