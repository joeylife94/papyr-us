name: GAP-007 Lock Refresh Candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  generate-lock:
    name: Generate npm lock candidate for first blocker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate bounded dependency candidate with npm
        shell: bash
        run: |
          set -euo pipefail
          cp package.json package.before.json
          cp package-lock.json package-lock.before.json

          # This plugin is loaded only by tailwind.config.ts during build.
          npm install 'tailwindcss-animate@^1.0.7' \
            --save-dev --package-lock-only --ignore-scripts

          # 10.40.0 is the first release in the current Sentry major line whose
          # registry metadata no longer declares minimatch on @sentry/node.
          npm install '@sentry/node@10.40.0' '@sentry/profiling-node@10.40.0' \
            --save --package-lock-only --ignore-scripts

          git diff -- package.json package-lock.json > dependency-candidate.diff
          npm audit --omit=dev --json > npm-audit-after-refresh.json || true
          npm ls brace-expansion --omit=dev --all --json > brace-ancestry-after-refresh.json 2>&1 || true

          node <<'NODE'
          const fs = require('fs');
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};
          const rows = Object.entries(pkgs)
            .filter(([p]) => p.includes('@sentry/') || p.endsWith('/tailwindcss-animate') || p.endsWith('/tailwindcss') || p.endsWith('/sucrase') || p.endsWith('/glob') || p.endsWith('/minimatch') || p.endsWith('/brace-expansion'))
            .map(([p, v]) => ({ path: p, version: v.version, dev: v.dev === true, dependencies: v.dependencies || {}, peerDependencies: v.peerDependencies || {} }));
          fs.writeFileSync('dependency-candidate-summary.json', JSON.stringify(rows, null, 2));

          const audit = JSON.parse(fs.readFileSync('npm-audit-after-refresh.json', 'utf8'));
          const highCritical = Object.values(audit.vulnerabilities || {}).filter(v => ['high','critical'].includes(String(v.severity || '').toLowerCase()));
          fs.writeFileSync('audit-high-critical-after-refresh.json', JSON.stringify(highCritical, null, 2));
          console.log(`HIGH/CRITICAL after candidate: ${highCritical.length}`);
          for (const v of highCritical.slice(0, 12)) console.log(`${v.severity} ${v.name} ${v.range || ''}`);
          NODE

          test -s dependency-candidate.diff

      - name: Upload npm-generated dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: gap007-lock-refresh-candidate
          path: |
            package.json
            package-lock.json
            dependency-candidate.diff
            dependency-candidate-summary.json
            npm-audit-after-refresh.json
            audit-high-critical-after-refresh.json
            brace-ancestry-after-refresh.json
          retention-days: 3
