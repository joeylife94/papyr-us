name: GAP-007 Lock Refresh Candidate

on:
  pull_request:
    branches: [main]

jobs:
  generate-and-commit:
    name: Generate and commit npm lock correction
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate bounded dependency correction with npm
        shell: bash
        run: |
          set -euo pipefail

          npm install 'tailwindcss-animate@^1.0.7' \
            --save-dev --package-lock-only --ignore-scripts

          npm install '@sentry/node@10.40.0' '@sentry/profiling-node@10.40.0' \
            --save --package-lock-only --ignore-scripts

          npm audit --omit=dev --json > npm-audit-after-refresh.json || true
          npm ls brace-expansion --omit=dev --all --json > brace-ancestry-after-refresh.json 2>&1 || true

          node <<'NODE'
          const fs = require('fs');
          const lock = require('./package-lock.json');
          const pkgs = lock.packages || {};
          const brace = Object.entries(pkgs).filter(([p]) => p.endsWith('/brace-expansion'));
          const minimatch = Object.entries(pkgs).filter(([p]) => p.endsWith('/minimatch'));
          const runtimeBrace = brace.filter(([, v]) => v.dev !== true);
          const runtimeMinimatch = minimatch.filter(([, v]) => v.dev !== true && String(v.version || '').startsWith('9.'));
          const ancestry = JSON.parse(fs.readFileSync('brace-ancestry-after-refresh.json', 'utf8'));
          const prodDeps = ancestry.dependencies || {};
          if (Object.keys(prodDeps).length !== 0) {
            throw new Error(`brace-expansion still appears in npm --omit=dev ancestry: ${JSON.stringify(prodDeps)}`);
          }
          if (runtimeBrace.length !== 0) {
            throw new Error(`brace-expansion lock nodes are not dev-only: ${runtimeBrace.map(([p,v]) => `${p}@${v.version}`).join(', ')}`);
          }
          if (runtimeMinimatch.length !== 0) {
            throw new Error(`minimatch 9.x remains runtime-present: ${runtimeMinimatch.map(([p,v]) => `${p}@${v.version}`).join(', ')}`);
          }
          console.log('Verified: brace-expansion has no production ancestry and all lock nodes are dev:true.');
          NODE

          git diff --check -- package.json package-lock.json
          git diff -- package.json package-lock.json

      - name: Commit npm-generated correction and remove generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papyr-us-gap007-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -- .github/workflows/gap007-lock-refresh.yml
          git add -- package.json package-lock.json
          git diff --cached --check
          git status --short
          git commit -m 'fix: remove first GAP-007 runtime dependency path'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
