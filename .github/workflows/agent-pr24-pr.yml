name: Agent PR24 pull request patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply patch
        shell: bash
        run: |
          if ! python scripts/agent_pr24_patch.py > pr24-patch-error.log 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pr24-patch-error.log
            git commit -m "chore: capture PR24 patch failure"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            cat pr24-patch-error.log
            exit 1
          fi
          rm -f pr24-patch-error.log
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - name: Commit implementation and remove temporary automation
        shell: bash
        run: |
          rm .github/workflows/agent-pr24.yml .github/workflows/agent-pr24-pr.yml scripts/agent_pr24_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts server/storage.ts tests/unit/document-production-paths.test.ts .github/workflows/agent-pr24.yml .github/workflows/agent-pr24-pr.yml scripts/agent_pr24_patch.py
          git commit -m "fix: harden document production paths"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
