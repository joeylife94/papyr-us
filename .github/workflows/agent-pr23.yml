name: Agent PR23 collaboration memory patch

on:
  push:
    branches:
      - fix/collaboration-memory-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/collaboration-memory-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply bounded collaboration lifecycle patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return updated

          socket_path = Path('server/services/socket.ts')
          socket = socket_path.read_text()
          socket = replace_once(
              socket,
              "type LegacyCollabConfig = {",
              "export type LegacyCollabConfig = {",
              'export legacy config type',
          )
          socket = replace_once(
              socket,
              "  rateLimitSavesPerMin: number;\n};",
              "  rateLimitSavesPerMin: number;\n  maxPayloadBytes: number;\n  maxRetainedChanges: number;\n};",
              'legacy config fields',
          )
          socket = replace_once(
              socket,
              "  const rateLimitSavesPerMin = clampInt(process.env.COLLAB_RATE_LIMIT_SAVES_PER_MIN, 6, 1, 60);",
              "  const rateLimitSavesPerMin = clampInt(process.env.COLLAB_RATE_LIMIT_SAVES_PER_MIN, 6, 1, 60);\n  const maxPayloadBytes = clampInt(\n    process.env.COLLAB_MAX_PAYLOAD_BYTES,\n    512 * 1024,\n    16 * 1024,\n    5 * 1024 * 1024\n  );\n  const maxRetainedChanges = clampInt(process.env.COLLAB_MAX_RETAINED_CHANGES, 25, 0, 100);",
              'legacy config values',
          )
          socket = replace_once(
              socket,
              "    rateLimitSavesPerMin,\n  };",
              "    rateLimitSavesPerMin,\n    maxPayloadBytes,\n    maxRetainedChanges,\n  };",
              'legacy config return',
          )
          socket = replace_once(
              socket,
              "class CollaborationManager {",
              "export class CollaborationManager {",
              'export collaboration manager',
          )
          socket = sub_once(
              socket,
              r"  joinSession\(pageId: number, user: User\): void \{.*?\n  \}\n\n  leaveSession\(userId: string\): void \{.*?\n  \}\n\n  addChange",
              """  joinSession(pageId: number, connectionId: string, user: User): void {
    const previousPageId = this.userSessions.get(connectionId);
    if (previousPageId && previousPageId !== pageId) {
      this.leaveSession(connectionId);
    }

    let session = this.getSession(pageId);
    if (!session) {
      session = this.createSession(pageId);
    }

    if (session.ttlTimer) {
      clearTimeout(session.ttlTimer);
      session.ttlTimer = undefined;
    }

    session.lastAccessAt = Date.now();
    session.users.set(connectionId, user);
    this.userSessions.set(connectionId, pageId);
    this.ensureSnapshotTimer(session);
  }

  leaveSession(connectionId: string): void {
    const pageId = this.userSessions.get(connectionId);
    if (!pageId) return;

    const session = this.getSession(pageId);
    if (session) {
      session.users.delete(connectionId);
      session.lastAccessAt = Date.now();
      if (session.users.size === 0) {
        this.stopSnapshotTimer(session);
        this.scheduleTtlUnload(session);
      }
    }
    this.userSessions.delete(connectionId);
  }

  addChange""",
              'connection scoped legacy lifecycle',
          )
          socket = sub_once(
              socket,
              r"  addChange\(pageId: number, change: DocumentChange\): void \{.*?\n  \}\n\n  getUsersInSession",
              """  addChange(pageId: number, change: DocumentChange): void {
    const session = this.getSession(pageId);
    if (!session) return;

    session.lastAccessAt = Date.now();

    const blocks = change.data?.blocks;
    if (Array.isArray(blocks)) {
      session.latestBlocks = blocks;
      this.markDirty(pageId);
    }

    if (this.cfg.maxRetainedChanges > 0) {
      const retainedChange: DocumentChange = Array.isArray(blocks)
        ? { ...change, data: { blockCount: blocks.length } }
        : change;
      session.changes.push(retainedChange);
      const overflow = session.changes.length - this.cfg.maxRetainedChanges;
      if (overflow > 0) session.changes.splice(0, overflow);
    }
  }

  getUsersInSession""",
              'bounded change retention',
          )
          socket = replace_once(
              socket,
              "    this.sessions.delete(pageId);",
              "    session.users.clear();\n    session.changes.length = 0;\n    session.latestBlocks = undefined;\n    this.sessions.delete(pageId);",
              'release legacy session references',
          )
          socket = replace_once(
              socket,
              "  const io = new SocketIOServer(server, {\n    cors: socketCorsOpts,\n  });",
              "  const io = new SocketIOServer(server, {\n    cors: socketCorsOpts,\n    maxHttpBufferSize: legacyCfg.maxPayloadBytes,\n  });",
              'socket payload cap',
          )
          socket = replace_once(
              socket,
              "          (socket.data as any).pageId = pageId;",
              "          const previousPageId = (socket.data as any).pageId as number | undefined;\n          if (previousPageId && previousPageId !== pageId) {\n            collaborationManager.leaveSession(socket.id);\n            const previousRoom = `page:${previousPageId}`;\n            socket.leave(previousRoom);\n            socket.to(previousRoom).emit('user-left', {\n              userId: String(userIdNum ?? socket.id),\n              timestamp: Date.now(),\n            });\n          }\n\n          (socket.data as any).pageId = pageId;",
              'leave previous legacy room',
          )
          socket = replace_once(
              socket,
              "            collaborationManager.joinSession(pageId, user);",
              "            collaborationManager.joinSession(pageId, socket.id, user);",
              'join by connection id',
          )
          socket = socket.replace("collaborationManager.leaveSession(userIdKey);", "collaborationManager.leaveSession(socket.id);")
          socket = replace_once(
              socket,
              "        collaborationManager.leaveSession(userIdKey);\n        if (pageId) {",
              "        collaborationManager.leaveSession(socket.id);\n        (socket.data as any).pageId = undefined;\n        (socket.data as any).canEdit = false;\n        if (pageId) {",
              'clear explicit leave state',
          )
          socket_path.write_text(socket)

          yjs_path = Path('server/services/yjs-collaboration.ts')
          yjs = yjs_path.read_text()
          yjs = replace_once(yjs, "type CollabConfig = {", "export type CollabConfig = {", 'export yjs config type')
          yjs = replace_once(
              yjs,
              "  rateLimitSavesPerMin: number;\n  requireAuth: boolean;",
              "  rateLimitSavesPerMin: number;\n  maxUpdateBytes: number;\n  requireAuth: boolean;",
              'yjs config field',
          )
          yjs = replace_once(
              yjs,
              "  const rateLimitSavesPerMin = clampInt(process.env.COLLAB_RATE_LIMIT_SAVES_PER_MIN, 6, 1, 60);",
              "  const rateLimitSavesPerMin = clampInt(process.env.COLLAB_RATE_LIMIT_SAVES_PER_MIN, 6, 1, 60);\n  const maxUpdateBytes = clampInt(\n    process.env.COLLAB_MAX_PAYLOAD_BYTES,\n    512 * 1024,\n    16 * 1024,\n    5 * 1024 * 1024\n  );",
              'yjs payload value',
          )
          yjs = replace_once(
              yjs,
              "    rateLimitSavesPerMin,\n  };",
              "    rateLimitSavesPerMin,\n    maxUpdateBytes,\n  };",
              'yjs config return',
          )
          yjs = replace_once(
              yjs,
              "class YjsCollaborationManager {\n  private docs = new Map<string, DocState>();",
              "export class YjsCollaborationManager {\n  private docs = new Map<string, DocState>();\n  private socketDocuments = new Map<string, string>();",
              'export yjs manager and connection map',
          )
          yjs = sub_once(
              yjs,
              r"  async joinDocument\(.*?\n  \}\n\n  leaveDocument\(socket: Socket\): void \{.*?\n  \}\n\n  private scheduleDebouncedSave",
              """  private detachSocketFromDocument(socket: Socket, documentId: string): void {
    const doc = this.docs.get(documentId);
    socket.leave(documentId);
    this.socketDocuments.delete(socket.id);
    if (!doc) return;

    doc.clients.delete(socket.id);
    doc.lastAccessAt = Date.now();
    if (doc.clients.size === 0) {
      this.stopSnapshotTimer(doc);
      this.scheduleTtlUnload(doc);
    }
  }

  async joinDocument(
    socket: Socket,
    documentId: string,
    pageId: number
  ): Promise<{ canEdit: boolean; permission: PermissionLevel | null }> {
    const previousDocumentId = this.socketDocuments.get(socket.id);
    if (previousDocumentId && previousDocumentId !== documentId) {
      this.detachSocketFromDocument(socket, previousDocumentId);
    }

    const doc = await this.getOrCreate(documentId, pageId);
    doc.lastAccessAt = Date.now();

    if (!doc.clients.has(socket.id) && doc.clients.size >= this.cfg.maxClientsPerDoc) {
      throw new Error(
        `Room is full (COLLAB_MAX_CLIENTS_PER_DOC=${this.cfg.maxClientsPerDoc}) for ${documentId}`
      );
    }

    if (doc.ttlTimer) {
      clearTimeout(doc.ttlTimer);
      doc.ttlTimer = undefined;
    }

    doc.clients.add(socket.id);
    this.socketDocuments.set(socket.id, documentId);
    socket.join(documentId);
    this.ensureSnapshotTimer(doc);

    const permission = (socket.data.userPermission as PermissionLevel | null) ?? null;
    const canEdit = !!socket.data.canEdit;

    logger.info('User joined Yjs document', {
      documentId,
      pageId,
      socketId: socket.id,
      totalUsers: doc.clients.size,
      userId: socket.data.userId,
      permission,
      canEdit,
    });

    return { canEdit, permission };
  }

  leaveDocument(socket: Socket): void {
    const documentId = this.socketDocuments.get(socket.id) ?? (socket.data.documentId as string | undefined);
    if (!documentId) return;

    this.detachSocketFromDocument(socket, documentId);
    logger.info('User left Yjs document', {
      documentId,
      socketId: socket.id,
      remainingUsers: this.docs.get(documentId)?.clients.size ?? 0,
    });
  }

  private scheduleDebouncedSave""",
              'connection scoped yjs lifecycle',
          )
          yjs = replace_once(
              yjs,
              "    doc.ydoc.off('update', doc.updateListener);\n    doc.ydoc.destroy();\n    this.docs.delete(documentId);",
              "    doc.ydoc.off('update', doc.updateListener);\n    doc.clients.clear();\n    doc.ydoc.destroy();\n    this.docs.delete(documentId);",
              'release yjs references',
          )
          yjs = replace_once(
              yjs,
              "    rateLimitUpdatesPerSec: cfg.rateLimitUpdatesPerSec,\n    rateLimitAwarenessPerSec: cfg.rateLimitAwarenessPerSec,",
              "    rateLimitUpdatesPerSec: cfg.rateLimitUpdatesPerSec,\n    rateLimitAwarenessPerSec: cfg.rateLimitAwarenessPerSec,\n    maxUpdateBytes: cfg.maxUpdateBytes,",
              'log yjs payload cap',
          ) if "    rateLimitUpdatesPerSec: cfg.rateLimitUpdatesPerSec,\n    rateLimitAwarenessPerSec: cfg.rateLimitAwarenessPerSec," in yjs else yjs
          yjs = replace_once(
              yjs,
              "        const stateVector = Y.encodeStateAsUpdate(ydoc);\n        socket.emit('yjs:init', {",
              "        const stateVector = Y.encodeStateAsUpdate(ydoc);\n        if (stateVector.byteLength > cfg.maxUpdateBytes) {\n          yjsManager!.leaveDocument(socket);\n          socket.emit('yjs:error', {\n            message: 'Document is too large for realtime collaboration',\n            code: 'DOCUMENT_TOO_LARGE',\n          });\n          return;\n        }\n        socket.emit('yjs:init', {",
              'guard oversized initial yjs state',
          )
          yjs = yjs.replace("        socket.data.ydoc = ydoc;\n", "")
          yjs = replace_once(
              yjs,
              "        const updateBuffer = Buffer.from(update, 'base64');\n        Y.applyUpdate(doc.ydoc, updateBuffer, socket.id); // Use socket.id as origin",
              "        if (typeof update !== 'string' || update.length > Math.ceil((cfg.maxUpdateBytes * 4) / 3) + 4) {\n          socket.emit('yjs:error', { message: 'Update payload too large', code: 'PAYLOAD_TOO_LARGE' });\n          return;\n        }\n        const updateBuffer = Buffer.from(update, 'base64');\n        if (updateBuffer.byteLength > cfg.maxUpdateBytes) {\n          socket.emit('yjs:error', { message: 'Update payload too large', code: 'PAYLOAD_TOO_LARGE' });\n          return;\n        }\n        Y.applyUpdate(doc.ydoc, updateBuffer, socket.id); // Use socket.id as origin",
              'guard yjs update payload',
          )
          yjs_path.write_text(yjs)

          test_path = Path('tests/unit/collaboration-memory-lifecycle.test.ts')
          test_path.write_text("""import { afterEach, describe, expect, it, vi } from 'vitest';
          import {
            CollaborationManager,
            type LegacyCollabConfig,
          } from '../../server/services/socket';
          import {
            YjsCollaborationManager,
            type CollabConfig,
          } from '../../server/services/yjs-collaboration';

          const legacyConfig: LegacyCollabConfig = {
            requireAuth: false,
            saveDebounceMs: 1000,
            snapshotIntervalMs: 5000,
            docTtlMs: 1000,
            maxDocs: 10,
            maxClientsPerDoc: 10,
            rateLimitDocChangesPerSec: 50,
            rateLimitCursorPerSec: 30,
            rateLimitTypingPerSec: 20,
            rateLimitSavesPerMin: 6,
            maxPayloadBytes: 1024,
            maxRetainedChanges: 2,
          };

          const yjsConfig: CollabConfig = {
            requireAuth: false,
            saveDebounceMs: 1000,
            snapshotIntervalMs: 5000,
            docTtlMs: 1000,
            maxDocs: 10,
            maxClientsPerDoc: 10,
            rateLimitUpdatesPerSec: 50,
            rateLimitAwarenessPerSec: 30,
            rateLimitSavesPerMin: 6,
            maxUpdateBytes: 1024,
          };

          afterEach(() => {
            vi.useRealTimers();
          });

          describe('collaboration memory lifecycle', () => {
            it('moves a legacy socket between pages without retaining the old session membership', () => {
              vi.useFakeTimers();
              const manager = new CollaborationManager({ updateWikiPage: vi.fn() } as any, legacyConfig);
              const user = { id: '42', name: 'User' };

              manager.joinSession(1, 'socket-1', user);
              manager.joinSession(2, 'socket-1', user);

              expect(manager.getUserCount(1)).toBe(0);
              expect(manager.getUserCount(2)).toBe(1);
            });

            it('retains only bounded metadata while keeping one latest block snapshot', () => {
              const manager = new CollaborationManager({ updateWikiPage: vi.fn() } as any, legacyConfig);
              manager.joinSession(1, 'socket-1', { id: '42', name: 'User' });
              const blocks = Array.from({ length: 100 }, (_, id) => ({ id, text: 'x'.repeat(100) }));

              for (let index = 0; index < 4; index += 1) {
                manager.addChange(1, {
                  pageId: 1,
                  blockId: String(index),
                  type: 'update',
                  data: { blocks },
                  timestamp: index,
                  userId: '42',
                });
              }

              const session = manager.getSession(1)!;
              expect(session.latestBlocks).toBe(blocks);
              expect(session.changes).toHaveLength(2);
              expect(session.changes.every((change) => !change.data?.blocks)).toBe(true);
              expect(session.changes[0].data).toEqual({ blockCount: 100 });
            });

            it('moves a Yjs socket between documents and releases the previous membership', async () => {
              vi.useFakeTimers();
              const namespace = {
                to: vi.fn(() => ({
                  except: vi.fn(() => ({ emit: vi.fn() })),
                  emit: vi.fn(),
                })),
              } as any;
              const storage = {
                getWikiPage: vi.fn().mockResolvedValue({ blocks: [] }),
                updateWikiPage: vi.fn(),
              } as any;
              const socket = {
                id: 'socket-1',
                data: { canEdit: true, userPermission: 'editor' },
                join: vi.fn(),
                leave: vi.fn(),
              } as any;
              const manager = new YjsCollaborationManager(namespace, storage, yjsConfig);

              await manager.joinDocument(socket, 'page-1', 1);
              await manager.joinDocument(socket, 'page-2', 2);

              expect(manager.getUserCount('page-1')).toBe(0);
              expect(manager.getUserCount('page-2')).toBe(1);
              expect(socket.leave).toHaveBeenCalledWith('page-1');

              manager.leaveDocument(socket);
              expect(manager.getUserCount('page-2')).toBe(0);
            });
          });
          """)
          PY
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/agent-pr23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/socket.ts server/services/yjs-collaboration.ts tests/unit/collaboration-memory-lifecycle.test.ts .github/workflows/agent-pr23.yml
          git commit -m "fix: bound collaboration session memory"
          git push origin HEAD:fix/collaboration-memory-lifecycle
